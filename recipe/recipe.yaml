schema_version: 1

context:
  version: "1.4.22"

package:
  name: rattler-build-conda-compat
  version: ${{ version }}

source:
  url: https://github.com/prefix-dev/rattler-build-conda-compat/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 54eeb1f222d6bf1690bd0cd498390dea356487f3d5de8f82829bfad888945665

build:
  number: 1
  noarch: python
  script:
    # Need to use SETUPTOOLS_SCM_PRETEND_VERSION as GitHub release tarballs don't contain a .git directory
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.24.0
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - rattler-build
    - conda-build
    - typing-extensions >=4.12.2
    - tomli
    - ruamel.yaml >=0.18.6
    - jinja2 >=3.0.2
    - pygithub

tests:
  - python:
      imports:
        - rattler_build_conda_compat.loader
        - rattler_build_conda_compat.render
        - rattler_build_conda_compat.conditional_list
        - rattler_build_conda_compat.recipe_sources
      # FIXME: Set 'pip_check' to 'true' after v1.4.23 or later.
      # see https://github.com/conda-forge/rattler-build-conda-compat/pull/144
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - downstream: conda-smithy >=3.61.1
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        # Upstream's snapshots are specific to the syrupy major version that wrote
        # them (syrupy 6 serializes dataclasses differently than syrupy 4 and 5),
        # so match the pin in upstream's pixi.toml and update it when upstream
        # regenerates the snapshots with a newer syrupy.
        - syrupy >=6,<7
    script:
      - pytest ./tests

about:
  summary: rattler-build module which offer compatibility with conda-smithy
  description: |
    rattler-build module which offer compatibility with conda-smithy
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/prefix-dev/rattler-build-conda-compat
  repository: https://github.com/prefix-dev/rattler-build-conda-compat

extra:
  recipe-maintainers:
    - Hofer-Julian
    - baszalmstra
    - minrk
    - nichmor
    - tdejager
    - matthewfeickert
